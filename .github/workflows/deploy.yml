name: Deploy

# The repository deploys from `develop` (there is no `main` branch), so this
# workflow previously never ran and the gh-pages branch kept an old, hand-made
# build that still pointed at the /mm-local-editor/ path.
on:
  push:
    branches:
      - develop
  workflow_dispatch:

# Keep the deployment serialised so two pushes cannot race on gh-pages.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --run

      - name: Build project
        run: npm run build

      - name: Upload production-ready build files
        uses: actions/upload-artifact@v4
        with:
          name: production-files
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    # The deploy step pushes the built site to the gh-pages branch, so the
    # job's GITHUB_TOKEN needs write access to repository contents.
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: production-files
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # Replace the branch content instead of merging into the previous
          # (stale, hand-made) deployment, so removed files disappear too.
          force_orphan: true
          commit_message: "chore: deploy ${{ github.sha }}"
