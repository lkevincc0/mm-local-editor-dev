name: CI/CD Pipeline

# -------------------------------------------------------------------------
# 1. Triggers
# The workflow runs on push to any branch and on pull requests targeting 'develop'.
# -------------------------------------------------------------------------
on:
  push:
    # Run on every push to ALL branches (by omitting 'branches' key)
    # This covers your requirement: "any branch push will run ci"
  pull_request:
    # Run when a PR is opened, updated, or synchronized, targeting the 'develop' branch
    branches:
      - develop

jobs:
  # =========================================================================
  # CI JOB: Build, Test (Runs on Push and PR)
  # =========================================================================
  ci:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest (Unit/Component Tests)
        run: npm test

      - name: Run Vite Build Check
        run: npm run build

      - name: Run Cypress E2E Tests
        uses: cypress-io/github-action@v6
        with:
          # `vite` binds "localhost" to IPv6 [::1] only, which makes wait-on
          # fail on runners with "Socket closed before the connection was
          # established". Bind the dev server to 127.0.0.1 explicitly and let
          # Cypress talk to the same address.
          start: npm run dev:ci
          # Plain http:// only: the action treats any other scheme as a file path.
          wait-on: 'http://127.0.0.1:5173/'
          wait-on-timeout: 120
        env:
          CYPRESS_BASE_URL: http://127.0.0.1:5173
