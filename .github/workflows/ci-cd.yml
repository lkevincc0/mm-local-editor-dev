name: CI/CD Pipeline

# -------------------------------------------------------------------------
# 1. Triggers
# The workflow runs on push to any branch and on pull requests targeting 'develop'.
# -------------------------------------------------------------------------
on:
  push:
    # Run on every push to ALL branches (by omitting 'branches' key)
    # This covers your requirement: "any branch push will run ci"
  pull_request:
    # Run when a PR is opened, updated, or synchronized, targeting the 'develop' branch
    branches:
      - develop

jobs:
  # =========================================================================
  # CI JOB: Build, Test (Runs on Push and PR)
  # =========================================================================
  ci:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest (Unit/Component Tests)
        run: npm test

      - name: Run Vite Build Check
        run: npm run build

      # Start the dev server ourselves: the action's built-in wait-on uses got,
      # whose pre-connect socket errors are not retried and surfaced as
      # "Socket closed before the connection was established".
      - name: Start dev server
        run: |
          nohup npm run dev:ci > "$RUNNER_TEMP/dev-server.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS --noproxy '*' --max-time 2 http://127.0.0.1:5173/ > /dev/null; then
              echo "Dev server ready on http://127.0.0.1:5173/ after $attempt attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::The dev server never answered on http://127.0.0.1:5173/"
          cat "$RUNNER_TEMP/dev-server.log"
          exit 1

      - name: Run Cypress E2E Tests
        uses: cypress-io/github-action@v6
        env:
          CYPRESS_BASE_URL: http://127.0.0.1:5173
